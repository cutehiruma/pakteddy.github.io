<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Sentence Scramble Race - Pro Turn-Based</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #00ff41;
        --bg: #050505;
        --danger: #ff4141;
      }

      body {
        font-family: "Share Tech Mono", monospace;
        background-color: var(--bg);
        color: var(--primary);
        height: 100vh;
        width: 100vw;
        margin: 0;
        overflow: hidden;
        touch-action: none;
        user-select: none;
      }

      .matrix-grid {
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(0, 255, 65, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 255, 65, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        z-index: -1;
      }

      .slot-area {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        min-height: 120px;
        padding: 15px;
        background: rgba(0, 0, 0, 0.3);
        border: 2px solid rgba(0, 255, 65, 0.1);
        border-radius: 12px;
      }

      .word-slot {
        min-width: 100px;
        height: 50px;
        border-bottom: 2px solid #333;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
      }

      .word-slot.active {
        border-bottom-color: var(--primary);
        background: rgba(0, 255, 65, 0.05);
      }

      .word-chip {
        background: #1a1a1a;
        border: 2px solid var(--primary);
        color: white;
        padding: 8px 16px;
        border-radius: 6px;
        font-weight: bold;
        cursor: grab;
        box-shadow: 0 4px 0 #004d1a;
        touch-action: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
      }

      .word-chip.dragging {
        position: fixed !important;
        z-index: 9999;
        pointer-events: none;
        opacity: 0.9;
        transform: scale(1.1);
        box-shadow: 0 10px 20px rgba(0, 255, 65, 0.3);
      }

      .btn-check {
        background: var(--primary);
        color: black;
        font-weight: 800;
        padding: 10px 25px;
        border-radius: 4px;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.2s;
        cursor: pointer;
      }

      .btn-check:disabled {
        background: #1a331a;
        color: #004d1a;
        cursor: not-allowed;
      }

      .team-panel {
        transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
      }

      .team-panel.inactive {
        filter: grayscale(1) brightness(0.2);
        pointer-events: none;
        opacity: 0.3;
        transform: scale(0.95);
      }

      .turn-indicator {
        position: absolute;
        top: -20px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--primary);
        color: black;
        padding: 2px 20px;
        font-size: 12px;
        font-weight: bold;
        border-radius: 20px;
        box-shadow: 0 0 15px var(--primary);
        display: none;
        white-space: nowrap;
        z-index: 20;
      }

      .team-panel.active-turn .turn-indicator {
        display: block;
        animation: pulse 1s infinite alternate;
      }

      .turn-timer {
        font-size: 40px;
        font-weight: 900;
        color: var(--primary);
        text-shadow: 0 0 10px var(--primary);
      }

      .turn-timer.warning {
        color: var(--danger);
        text-shadow: 0 0 10px var(--danger);
        animation: shake 0.2s infinite;
      }

      @keyframes pulse {
        from {
          opacity: 0.7;
          transform: translateX(-50%) scale(0.9);
        }
        to {
          opacity: 1;
          transform: translateX(-50%) scale(1.1);
        }
      }

      .error-shake {
        animation: shake 0.4s ease-in-out;
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-8px);
        }
        75% {
          transform: translateX(8px);
        }
      }

      canvas#fireworks {
        position: fixed;
        inset: 0;
        z-index: 9999;
        pointer-events: none;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="matrix-grid"></div>
    <canvas id="fireworks"></canvas>

    <header
      class="fixed top-0 w-full p-4 flex justify-between items-center z-50"
    >
      <div class="text-left w-1/4">
        <div class="text-[10px] opacity-50">NODE_ALPHA</div>
        <div id="scoreA" class="text-3xl font-black">0/5</div>
      </div>

      <div class="text-center flex-1">
        <h1 class="text-xl md:text-3xl font-black tracking-[0.3em] text-white">
          SENTENCE BREAKER
        </h1>
        <div id="turnClock" class="turn-timer">30</div>
        <button
          id="startBtn"
          onclick="initGame()"
          class="mt-2 bg-transparent border border-primary text-primary px-8 py-2 rounded-full text-sm font-bold hover:bg-primary hover:text-black transition uppercase tracking-widest"
        >
          Start Mission
        </button>
      </div>

      <div class="text-right w-1/4">
        <div class="text-[10px] opacity-50">NODE_BETA</div>
        <div id="scoreB" class="text-3xl font-black">0/5</div>
      </div>
    </header>

    <main class="flex h-full pt-40 pb-8 px-4 gap-4">
      <!-- Player A Side -->
      <section
        id="panelA"
        class="team-panel flex-1 flex flex-col bg-black/40 border border-white/5 rounded-3xl p-4 overflow-hidden inactive"
      >
        <div class="turn-indicator">SYSTEM AUTHORIZED</div>
        <div class="flex justify-between items-center mb-4 px-2">
          <span class="text-xs font-bold text-primary">TEAM_ALPHA</span>
          <button
            id="checkA"
            onclick="validate('A')"
            class="btn-check text-xs"
            disabled
          >
            Check
          </button>
        </div>

        <div class="flex-1 flex flex-col gap-6 overflow-y-auto">
          <div id="targetA" class="slot-area"></div>
          <div id="sourceA" class="slot-area border-dashed"></div>
        </div>
      </section>

      <!-- Player B Side -->
      <section
        id="panelB"
        class="team-panel flex-1 flex flex-col bg-black/40 border border-white/5 rounded-3xl p-4 overflow-hidden inactive"
      >
        <div class="turn-indicator">SYSTEM AUTHORIZED</div>
        <div class="flex justify-between items-center mb-4 px-2">
          <span class="text-xs font-bold text-primary">TEAM_BETA</span>
          <button
            id="checkB"
            onclick="validate('B')"
            class="btn-check text-xs"
            disabled
          >
            Check
          </button>
        </div>

        <div class="flex-1 flex flex-col gap-6 overflow-y-auto">
          <div id="targetB" class="slot-area"></div>
          <div id="sourceB" class="slot-area border-dashed"></div>
        </div>
      </section>
    </main>

    <div
      id="modal"
      class="fixed inset-0 bg-black/95 hidden items-center justify-center z-[10000]"
    >
      <div
        class="text-center p-12 border-2 border-primary rounded-xl bg-black shadow-[0_0_80px_rgba(0,255,65,0.4)]"
      >
        <h2
          id="modalTitle"
          class="text-6xl font-black mb-4 text-white uppercase tracking-tighter"
        >
          Mission Success
        </h2>
        <p
          id="modalWinner"
          class="text-2xl mb-10 text-primary tracking-widest"
        ></p>
        <button
          onclick="location.reload()"
          class="btn-check px-16 py-5 text-xl"
        >
          Restart System
        </button>
      </div>
    </div>

    <script>
      // Database 50 Kalimat
      const sentencePool = [
        "I GO TO SCHOOL EVERY DAY",
        "THEY ARE PLAYING FOOTBALL NOW",
        "MY FATHER IS A DOCTOR",
        "SHE COOKS RICE IN THE KITCHEN",
        "WE WATCH MOVIE ON SUNDAY",
        "THE CAT IS SLEEPING UNDER TABLE",
        "HE DRINKS MILK EVERY MORNING",
        "BIRDS FLY IN THE BLUE SKY",
        "WE LOVE TO EAT PIZZA",
        "STUDENTS STUDY HARD FOR EXAM",
        "THE SUN RISES IN THE EAST",
        "I HAVE TWO BROTHERS AND SISTERS",
        "THEY VISIT THEIR GRANDMA ON WEEKEND",
        "WATER BOILS AT ONE HUNDRED DEGREES",
        "SHE WRITES A LETTER FOR FRIEND",
        "WE PLAY HIDE AND SEEK TOGETHER",
        "THE FLOWERS ARE BLOOMING IN GARDEN",
        "HE RIDES HIS BICYCLE TO PARK",
        "MY MOTHER BAKES A CHOCOLATE CAKE",
        "THE DOG BARKS AT THE STRANGER",
        "WE READ BOOKS IN THE LIBRARY",
        "THE TEACHER EXPLAINS THE LESSON CLEARLY",
        "I BRUSH MY TEETH TWICE A DAY",
        "THEY GO SWIMMING EVERY SATURDAY MORNING",
        "SHE WEARS A BEAUTIFUL PINK DRESS",
        "MY BROTHER PLAYS GUITAR VERY WELL",
        "WE CLEAN OUR CLASSROOM EVERY FRIDAY",
        "THE ELEPHANT IS A VERY BIG ANIMAL",
        "I LIKE TO DRINK ORANGE JUICE",
        "THEY ARE RUNNING AROUND THE FIELD",
        "MY GRANDFATHER WORKS IN THE FARM",
        "SHE IS WASHING HER NEW CAR",
        "WE EAT LUNCH AT THE CANTEEN",
        "THE RAIN FALLS FROM THE CLOUDS",
        "I BRING AN UMBRELLA IN RAIN",
        "THEY LISTEN TO MUSIC EVERY NIGHT",
        "MY SISTER HELPS ME WITH HOMEWORK",
        "THE MONKEY CLIMBS THE TALL TREE",
        "WE CELEBRATE MY BIRTHDAY EVERY YEAR",
        "THE STARS SHINE BRIGHT AT NIGHT",
        "I WANT TO BE A PILOT",
        "THEY TAKE THE BUS TO OFFICE",
        "SHE BUYS FRUITS AT THE MARKET",
        "WE SING SONGS IN THE CHOIR",
        "THE FISH SWIMS IN THE RIVER",
        "I WASH MY HANDS BEFORE EATING",
        "THEY BUILD A LARGE SAND CASTLE",
        "MY COUSIN LIVES IN A BIG CITY",
        "THE DOCTOR GIVES MEDICINE TO PATIENT",
        "WE ENJOY THE VIEW FROM MOUNTAIN",
      ];

      let state = {
        A: { wins: 0, current: [], original: "" },
        B: { wins: 0, current: [], original: "" },
        currentTurn: "A",
        gameActive: false,
        turnTime: 30,
        timerInterval: null,
      };

      let dragItem = null;
      let startX, startY;
      let originalParent = null;

      function initGame() {
        state.gameActive = true;
        document.getElementById("startBtn").classList.add("hidden");
        nextLevel("A");
        nextLevel("B");
        updateTurnVisuals();
        startCountdown();
      }

      function startCountdown() {
        clearInterval(state.timerInterval);
        state.turnTime = 30;
        const clock = document.getElementById("turnClock");
        clock.innerText = state.turnTime;
        clock.classList.remove("warning");

        state.timerInterval = setInterval(() => {
          if (!state.gameActive) return;
          state.turnTime--;
          clock.innerText = state.turnTime;

          if (state.turnTime <= 5) clock.classList.add("warning");

          if (state.turnTime <= 0) {
            clearInterval(state.timerInterval);
            switchTurn();
          }
        }, 1000);
      }

      function updateTurnVisuals() {
        const panelA = document.getElementById("panelA");
        const panelB = document.getElementById("panelB");

        if (state.currentTurn === "A") {
          panelA.classList.remove("inactive");
          panelA.classList.add("active-turn");
          panelB.classList.add("inactive");
          panelB.classList.remove("active-turn");
        } else {
          panelB.classList.remove("inactive");
          panelB.classList.add("active-turn");
          panelA.classList.add("inactive");
          panelA.classList.remove("active-turn");
        }
      }

      function switchTurn() {
        state.currentTurn = state.currentTurn === "A" ? "B" : "A";
        updateTurnVisuals();
        startCountdown();
      }

      function nextLevel(team) {
        const raw =
          sentencePool[Math.floor(Math.random() * sentencePool.length)];
        const words = raw.split(" ");
        state[team].original = raw;
        state[team].current = words;

        const targetArea = document.getElementById(`target${team}`);
        const sourceArea = document.getElementById(`source${team}`);
        const checkBtn = document.getElementById(`check${team}`);

        targetArea.innerHTML = "";
        sourceArea.innerHTML = "";
        checkBtn.disabled = true;

        words.forEach(() => {
          const slot = document.createElement("div");
          slot.className = "word-slot";
          slot.dataset.team = team;
          targetArea.appendChild(slot);
        });

        const shuffled = [...words].sort(() => Math.random() - 0.5);
        shuffled.forEach((w) => {
          const slot = document.createElement("div");
          slot.className = "word-slot";
          slot.dataset.team = team;
          const chip = createChip(w, team);
          slot.appendChild(chip);
          sourceArea.appendChild(slot);
        });
      }

      function createChip(text, team) {
        const el = document.createElement("div");
        el.className = "word-chip";
        el.innerText = text;
        el.dataset.team = team;
        el.addEventListener("pointerdown", onPointerDown);
        return el;
      }

      function onPointerDown(e) {
        if (
          !state.gameActive ||
          e.currentTarget.dataset.team !== state.currentTurn
        )
          return;

        dragItem = e.currentTarget;
        originalParent = dragItem.parentElement;
        const rect = dragItem.getBoundingClientRect();
        startX = e.clientX - rect.left;
        startY = e.clientY - rect.top;

        dragItem.classList.add("dragging");
        dragItem.style.width = rect.width + "px";
        dragItem.style.left = rect.left + "px";
        dragItem.style.top = rect.top + "px";

        dragItem.setPointerCapture(e.pointerId);
        dragItem.addEventListener("pointermove", onPointerMove);
        dragItem.addEventListener("pointerup", onPointerUp);
      }

      function onPointerMove(e) {
        if (!dragItem) return;
        dragItem.style.left = e.clientX - startX + "px";
        dragItem.style.top = e.clientY - startY + "px";

        const target = document.elementFromPoint(e.clientX, e.clientY);
        const slot = target?.closest(".word-slot");

        document
          .querySelectorAll(".word-slot")
          .forEach((s) => s.classList.remove("active"));
        if (
          slot &&
          slot.dataset.team === dragItem.dataset.team &&
          !slot.hasChildNodes()
        ) {
          slot.classList.add("active");
        }
      }

      function onPointerUp(e) {
        if (!dragItem) return;
        const target = document.elementFromPoint(e.clientX, e.clientY);
        const slot = target?.closest(".word-slot");
        const team = dragItem.dataset.team;

        if (slot && slot.dataset.team === team && !slot.hasChildNodes()) {
          slot.appendChild(dragItem);
        } else {
          originalParent.appendChild(dragItem);
        }

        dragItem.classList.remove("dragging");
        dragItem.style.position = "static";
        dragItem.style.width = "auto";

        const targetArea = document.getElementById(`target${team}`);
        const chipsInTarget = targetArea.querySelectorAll(".word-chip").length;
        document.getElementById(`check${team}`).disabled =
          chipsInTarget < state[team].current.length;

        dragItem.removeEventListener("pointermove", onPointerMove);
        dragItem.removeEventListener("pointerup", onPointerUp);
        dragItem = null;
      }

      function validate(team) {
        const targetArea = document.getElementById(`target${team}`);
        const chips = targetArea.querySelectorAll(".word-chip");
        const userSentence = Array.from(chips)
          .map((c) => c.innerText)
          .join(" ");

        if (userSentence === state[team].original) {
          state[team].wins++;
          document.getElementById(`score${team}`).innerText =
            `${state[team].wins}/5`;

          if (state[team].wins >= 5) {
            showWin(team === "A" ? "TEAM ALPHA" : "TEAM BETA");
          } else {
            targetArea.style.borderColor = "#00ff41";
            setTimeout(() => {
              targetArea.style.borderColor = "";
              nextLevel(team);
              switchTurn();
            }, 800);
          }
        } else {
          targetArea.classList.add("error-shake");
          targetArea.style.borderColor = "#ff4141";
          setTimeout(() => {
            targetArea.classList.remove("error-shake");
            targetArea.style.borderColor = "";
            switchTurn();
          }, 800);
        }
      }

      function showWin(winner) {
        state.gameActive = false;
        clearInterval(state.timerInterval);
        const modal = document.getElementById("modal");
        const winnerText = document.getElementById("modalWinner");
        modal.classList.remove("hidden");
        modal.classList.add("flex");
        winnerText.innerText = `${winner} HAS SECURED THE DATABASE`;

        const canvas = document.getElementById("fireworks");
        canvas.style.display = "block";
        startFireworks();
      }

      function startFireworks() {
        const canvas = document.getElementById("fireworks");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        function createParticle(x, y) {
          for (let i = 0; i < 30; i++) {
            particles.push({
              x,
              y,
              vx: (Math.random() - 0.5) * 10,
              vy: (Math.random() - 0.5) * 10,
              life: 100,
              color: `hsl(${Math.random() * 360}, 100%, 50%)`,
            });
          }
        }

        function update() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          if (Math.random() < 0.1)
            createParticle(
              Math.random() * canvas.width,
              Math.random() * canvas.height,
            );

          for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life--;
            if (p.life <= 0) particles.splice(i, 1);
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, 4, 4);
          }
          requestAnimationFrame(update);
        }
        update();
      }

      window.addEventListener("contextmenu", (e) => e.preventDefault());
    </script>
  </body>
</html>
